name: PolySports backend tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_test
          POSTGRES_PASSWORD: mock-ci-password
          POSTGRES_DB: polysports_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_test -d polysports_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POLYSPORTS_TEST_DATABASE_URL: postgresql+psycopg://ci_test:mock-ci-password@127.0.0.1:5432/polysports_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned uv
        run: python -m pip install 'uv==0.11.22'
      - name: Sync dependencies
        run: uv sync --locked --group dev
        working-directory: polysports
      - name: Run backend tests
        run: uv run --locked pytest -q
        working-directory: polysports
