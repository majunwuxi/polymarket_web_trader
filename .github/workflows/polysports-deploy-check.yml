name: PolySports isolated Linux deployment check

on:
  push:
    branches: [codex/polysports-deploy-validation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned uv
        run: python -m pip install 'uv==0.11.22'
      - name: Validate isolated deployment and recovery
        run: bash polysports/deploy/tests/linux-ci.sh
