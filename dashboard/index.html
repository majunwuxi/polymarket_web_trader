<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>Polymarket 持仓监控面板</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #050816;
      --bg-elevated: #0f172a;
      --bg-elevated-soft: #020617;
      --bg-body: #0b1220;
      --bg-card: #0f172a;
      --border-subtle: rgba(148, 163, 184, 0.25);
      --border-main: rgba(148, 163, 184, 0.35);
      --border-accent: rgba(56, 189, 248, 0.4);
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.16);
      --accent-strong: #0ea5e9;
      --text-main: #e5e7eb;
      --text-sub: #9ca3af;
      --danger: #f97373;
      --success: #4ade80;
      --warning: #facc15;
      --radius-lg: 18px;
      --radius-pill: 999px;
      --shadow-soft: 0 18px 45px rgba(15, 23, 42, 0.7);
      --panel-bg: rgba(15, 23, 42, 0.95);
      --panel-right-bg: rgba(15, 23, 42, 0.96);
      --chip-bg: rgba(15, 23, 42, 0.85);
      --chip-border: rgba(148, 163, 184, 0.3);
      --pill-bg: rgba(15, 23, 42, 0.9);
      --pill-badge-bg: rgba(148, 163, 184, 0.16);
      --tag-beta-bg: rgba(15, 23, 42, 0.8);
      --toggle-bg: rgba(15, 23, 42, 0.9);
      --badge-border: rgba(148, 163, 184, 0.5);
      --card-bg: rgba(15, 23, 42, 0.9);
      --card-border: rgba(30, 64, 175, 0.8);
      --table-header-bg: rgba(15, 23, 42, 0.96);
      --table-header-border: rgba(51, 65, 85, 0.9);
      --table-row-border: rgba(30, 64, 175, 0.42);
      --table-row-even-bg: rgba(15, 23, 42, 0.92);
      --table-row-odd-bg: rgba(15, 23, 42, 0.86);
      --table-row-hover-bg: rgba(15, 118, 255, 0.18);
      --progress-track-bg: rgba(15, 23, 42, 0.9);
      --progress-border: rgba(30, 64, 175, 0.8);
      --topbar-bg: linear-gradient(120deg, rgba(15, 23, 42, 0.96), rgba(15, 23, 42, 0.92), rgba(15, 23, 42, 0.96));
      --avatar-dot-bg: radial-gradient(circle at 30% 0%, #fbbf24, #6366f1);
    }
    :root[data-theme="light"] {
      --bg: #f6f7fb;
      --bg-elevated: #ffffff;
      --bg-elevated-soft: #f2f4f8;
      --bg-body: #f9fafb;
      --bg-card: #ffffff;
      --border-subtle: rgba(0, 0, 0, 0.12);
      --border-main: rgba(0, 0, 0, 0.18);
      --border-accent: rgba(14, 165, 233, 0.4);
      --accent: #0ea5e9;
      --accent-soft: rgba(14, 165, 233, 0.12);
      --accent-strong: #0284c7;
      --text-main: #111827;
      --text-sub: #6b7280;
      --danger: #dc2626;
      --success: #16a34a;
      --warning: #ca8a04;
      --shadow-soft: 0 10px 24px rgba(0, 0, 0, 0.12);
      --panel-bg: #ffffff;
      --panel-right-bg: #ffffff;
      --chip-bg: #f2f4f8;
      --chip-border: rgba(0, 0, 0, 0.10);
      --pill-bg: #f8fafc;
      --pill-badge-bg: rgba(0, 0, 0, 0.06);
      --tag-beta-bg: rgba(14, 165, 233, 0.10);
      --toggle-bg: #f8fafc;
      --badge-border: rgba(0, 0, 0, 0.12);
      --card-bg: #ffffff;
      --card-border: rgba(0, 0, 0, 0.08);
      --table-header-bg: #f9fafb;
      --table-header-border: rgba(0, 0, 0, 0.08);
      --table-row-border: rgba(0, 0, 0, 0.06);
      --table-row-even-bg: #ffffff;
      --table-row-odd-bg: #f9fafb;
      --table-row-hover-bg: rgba(14, 165, 233, 0.12);
      --progress-track-bg: #f3f4f6;
      --progress-border: rgba(0, 0, 0, 0.08);
      --topbar-bg: linear-gradient(120deg, rgba(255, 255, 255, 0.96), rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.96));
      --avatar-dot-bg: radial-gradient(circle at 30% 0%, #fde68a, #60a5fa);
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.18), transparent 55%),
        radial-gradient(circle at bottom right, rgba(129, 140, 248, 0.18), transparent 55%),
        var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px 28px;
      overflow-x: hidden;
      overflow-y: auto;
    }

    .shell {
      max-width: 1920px;
      width: 100%;
      margin: 0 auto;
      height: calc(100vh - 40px);
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow: visible;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-radius: var(--radius-lg);
      background: var(--topbar-bg);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(20px);
      overflow: visible;
      position: relative;
      z-index: 1000;
    }

    .top-title-block {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .top-logo {
      width: 32px;
      height: 32px;
      border-radius: 14px;
      background: radial-gradient(circle at 30% 0%, #38bdf8, #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      box-shadow: 0 10px 30px rgba(56, 189, 248, 0.5);
    }

    .top-title {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .top-title-main {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.03em;
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .tag-beta {
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--accent-soft);
      background: var(--tag-beta-bg);
      font-size: 10px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .top-title-sub {
      font-size: 12px;
      color: var(--text-sub);
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      position: relative;
    }

    .pill {
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--accent-soft);
      background: var(--pill-bg);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-main);
      font-size: 11px;
    }

    .pill-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.8);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .pill-badge {
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--pill-badge-bg);
      color: var(--text-sub);
      font-size: 10px;
    }

    .time-text {
      color: var(--text-sub);
    }

    .main-layout {
      flex: 1;
      display: flex;
      gap: 16px;
      min-height: 0;
      overflow: visible;
    }

    .col-left {
      flex: 6 1 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
    }

    .col-right {
      flex: 4 1 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
    }

    .panel {
      height: 100%;
      border-radius: var(--radius-lg);
      background: radial-gradient(circle at top left, rgba(148, 163, 184, 0.18), transparent 55%),
                  var(--panel-bg);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-direction: column;
      padding: 14px 16px;
      backdrop-filter: blur(16px);
      min-height: 0;
    }

    .col-right > .panel {
      height: auto;
      flex: 1;
    }

    .quick-trade-panel {
      height: auto;
      flex: 0 0 auto;
      padding: 0;
      position: relative;
      overflow: hidden;
      border-color: var(--border-accent);
      transition: box-shadow 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
    }

    .quick-trade-panel::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--success), var(--warning));
      opacity: 0.75;
      pointer-events: none;
    }

    .quick-trade-panel .panel-body {
      padding: 16px;
    }

    .quick-trade-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .quick-trade-title {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
    }

    .quick-trade-title svg,
    .trade-section-title svg {
      flex: 0 0 auto;
    }

    .quick-trade-source {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 9px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-pill);
      background: var(--pill-bg);
      color: var(--text-sub);
      font-size: 11px;
      white-space: nowrap;
    }

    .quick-trade-columns {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 12px;
      align-items: stretch;
    }

    .quick-trade-col-separator {
      display: none;
    }

    .quick-trade-col {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      background:
        linear-gradient(180deg, rgba(148, 163, 184, 0.10), transparent 70%),
        rgba(15, 23, 42, 0.35);
    }

    :root[data-theme="light"] .quick-trade-col {
      background:
        linear-gradient(180deg, rgba(14, 165, 233, 0.06), transparent 70%),
        rgba(255, 255, 255, 0.74);
    }

    .quick-trade-col-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 24px;
    }

    .trade-section-title {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
    }

    .trade-section-title span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .trade-section-kicker {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .trade-input-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
    }

    .trade-input,
    .trade-amount-input {
      width: 100%;
      min-width: 0;
      border: 1px solid var(--border-main);
      border-radius: 8px;
      background: var(--bg-body);
      color: var(--text-main);
      outline: none;
      transition: border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
    }

    .trade-input {
      min-height: 34px;
      padding: 7px 10px;
      font-size: 12px;
    }

    .trade-amount-input {
      min-height: 32px;
      padding: 6px 9px;
      font-size: 12px;
    }

    .trade-input:focus,
    .trade-amount-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .trade-fetch-btn {
      min-height: 34px;
      padding: 0 13px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .trade-fetch-btn.spx {
      background: var(--warning);
      border-color: var(--warning);
      color: #111827;
    }

    .trade-market-area {
      min-height: 0;
    }

    .trade-market-url {
      margin-bottom: 6px;
      font-size: 10px;
      line-height: 1.35;
      word-break: break-all;
    }

    .trade-market-title {
      display: none;
      margin-bottom: 8px;
      color: var(--text-main);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.35;
    }

    .trade-price-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(118px, 1fr));
      gap: 8px;
    }

    .trade-price-card {
      min-width: 0;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      background: var(--bg-card);
      padding: 9px 10px;
    }

    .trade-price-label {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      margin-bottom: 5px;
      color: var(--text-sub);
      font-size: 11px;
      font-weight: 700;
    }

    .trade-price-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex: 0 0 auto;
    }

    .trade-price-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .trade-price-main {
      font-size: 20px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1;
      letter-spacing: 0;
    }

    .trade-price-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 5px;
      color: var(--text-sub);
      font-size: 10px;
      line-height: 1.2;
    }

    .trade-price-meta .spread {
      color: var(--warning);
    }

    .trade-position-info {
      margin-top: 7px;
      color: var(--text-sub);
      font-size: 10px;
      line-height: 1.35;
    }

    .trade-entry-area {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border-subtle);
    }

    .trade-entry-row {
      display: grid;
      grid-template-columns: minmax(90px, 0.8fr) minmax(150px, 1.5fr);
      gap: 8px;
      align-items: end;
    }

    .trade-entry-label {
      display: block;
      margin-bottom: 4px;
      color: var(--text-sub);
      font-size: 10px;
      font-weight: 700;
    }

    .trade-outcome-buttons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 6px;
      min-width: 0;
    }

    .trade-buy-btn {
      min-height: 38px;
      padding: 7px 9px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      line-height: 1.15;
      white-space: normal;
      overflow-wrap: anywhere;
      border: 1px solid transparent;
    }

    .trade-buy-btn .price {
      display: block;
      margin-top: 2px;
      font-size: 10px;
      font-weight: 700;
      opacity: 0.85;
    }

    .trade-empty-btn {
      opacity: 0.58;
    }

    .trade-result-area {
      margin-top: 7px;
    }

    @media (max-width: 768px) {
      .quick-trade-columns {
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .trade-entry-row {
        grid-template-columns: 1fr;
      }
    }

    .quick-trade-panel.is-loading {
      border-color: var(--accent);
      box-shadow: 0 18px 45px rgba(56, 189, 248, 0.18);
    }

    .panel-right {
      background: radial-gradient(circle at top right, rgba(56, 189, 248, 0.25), transparent 60%),
                  var(--panel-right-bg);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      gap: 10px;
    }

    .panel-title-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .panel-title-main {
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel-stats-rows {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 6px;
    }

    .panel-stats-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .panel-title-main span.highlight {
      background: linear-gradient(120deg, #38bdf8, #a855f7);
      -webkit-background-clip: text;
      color: transparent;
    }

    .panel-title-sub {
      font-size: 11px;
      color: var(--text-sub);
    }

    .panel-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
    }

    .toggle-group {
      display: inline-flex;
      border-radius: var(--radius-pill);
      background: var(--toggle-bg);
      border: 1px solid var(--border-subtle);
      overflow: hidden;
    }

    .toggle-btn {
      padding: 3px 10px;
      border: none;
      background: transparent;
      color: var(--text-sub);
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
    }

    .toggle-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .chip {
      padding: 3px 8px;
      border-radius: var(--radius-pill);
      background: var(--chip-bg);
      border: 1px solid var(--chip-border);
      color: var(--text-sub);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .chip-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--accent);
    }

    .chip-positive {
      color: var(--success);
      border-color: rgba(74, 222, 128, 0.4);
    }

    .chip-negative {
      color: var(--danger);
      border-color: rgba(248, 113, 113, 0.5);
    }

    .table-wrapper {
      flex: 1;
      border-radius: calc(var(--radius-lg) - 4px);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .table-scroll {
      flex: 1;
      overflow: auto;
      border-radius: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      min-width: 640px;
    }

    thead {
      position: sticky;
      top: 0;
      z-index: 1;
    }

    thead tr {
      background: var(--table-header-bg);
    }

    th, td {
      text-align: left;
      padding: 6px 10px;
      white-space: nowrap;
    }
    
    tr {
      border-spacing: 0;
    }

    th {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border-bottom: 1px solid var(--table-header-border);
      cursor: default;
      user-select: none;
    }
    
    th.sortable {
      cursor: pointer;
      position: relative;
      padding-right: 20px;
    }
    
    th.sortable:hover {
      color: var(--accent);
    }
    
    th.sortable::after {
      content: '↕';
      position: absolute;
      right: 6px;
      font-size: 10px;
      opacity: 0.5;
    }
    
    th.sortable.sort-asc::after {
      content: '↑';
      opacity: 1;
      color: var(--accent);
    }
    
    th.sortable.sort-desc::after {
      content: '↓';
      opacity: 1;
      color: var(--accent);
    }

    tbody tr {
      border-bottom: 1px solid var(--table-row-border);
      transition: background 0.15s ease, transform 0.08s ease;
    }

    tbody tr:nth-child(even) {
      background: var(--table-row-even-bg);
    }

    tbody tr:nth-child(odd) {
      background: var(--table-row-odd-bg);
    }

    tbody tr:hover {
      background: var(--table-row-hover-bg);
      transform: translateY(-1px);
    }

    td {
      color: var(--text-main);
    }

    .col-market {
      max-width: 240px;
    }

    .market-name {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .market-title {
      font-size: 16px;
      font-weight: 500;
    }
    
    .market-title-link {
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      transition: color 0.2s;
      display: inline-block;
    }
    
    .market-title-link:hover {
      color: var(--accent);
      text-decoration: underline;
    }
    
    .market-title-link:visited {
      color: inherit;
    }
    
    .market-title-link:hover .market-title {
      color: var(--accent);
    }

    .market-sub {
      font-size: 11px;
      color: var(--text-sub);
    }

    .pill-outcome {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      background: var(--pill-bg);
      border: 1px solid var(--badge-border);
      font-size: 11px;
      gap: 6px;
    }

    .pill-outcome-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }

    .text-num-sub {
      font-size: 11px;
      color: var(--text-sub);
    }

    .text-profit {
      color: var(--success);
      font-weight: 500;
    }

    .text-loss {
      color: var(--danger);
      font-weight: 500;
    }

    .text-muted {
      color: var(--text-sub);
    }

    .align-right {
      text-align: right;
    }

    .bucket-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      margin-bottom: 6px;
    }

    .bucket-meta-left {
      display: flex;
      gap: 6px;
    }

    .bucket-progress {
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: var(--progress-track-bg);
      overflow: hidden;
      border: 1px solid var(--progress-border);
      margin-top: 2px;
    }

    .bucket-progress-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #22c55e, #eab308);
      box-shadow: 0 0 16px rgba(74, 222, 128, 0.9);
      transition: width 0.3s ease;
    }

    .bucket-list-header {
      font-size: 11px;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.09em;
      margin-top: 6px;
      margin-bottom: 4px;
    }

    .bucket-list {
      flex: 1;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 4px;
      padding-bottom: 4px;
    }

    .bucket-card {
      border-radius: 14px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 8px 10px;
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
      column-gap: 12px;
      row-gap: 6px;
      font-size: 11px;
    }

    .bucket-card-header {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 2px;
    }

    .bucket-title {
      font-size: 12px;
      font-weight: 500;
    }

    .bucket-tag {
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      background: var(--pill-bg);
      border: 1px solid var(--badge-border);
      color: var(--accent);
      font-size: 10px;
    }

    .bucket-field-label {
      color: var(--text-sub);
      margin-bottom: 2px;
    }

    .bucket-field-value {
      color: var(--text-main);
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bucket-field-row {
      display: flex;
      justify-content: space-between;
      gap: 6px;
    }

    .bucket-field-row > div {
      flex: 1;
    }

    .bucket-trader-pill {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      background: var(--accent-soft);
      color: var(--text-main);
      font-size: 11px;
      gap: 6px;
    }

    .avatar-dot {
      width: 16px;
      height: 16px;
      border-radius: 999px;
      background: var(--avatar-dot-bg);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 600;
      color: var(--text-main);
    }

    .bucket-table-wrapper {
      grid-column: 1 / -1;
      margin-top: 6px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: var(--panel-right-bg);
      overflow: hidden;
    }

    .bucket-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }

    .bucket-table thead {
      background: var(--table-header-bg);
    }

    .bucket-table th,
    .bucket-table td {
      padding: 6px 8px;
      text-align: left;
      white-space: nowrap;
    }

    .bucket-table th {
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border-bottom: 1px solid var(--table-header-border);
    }

    .bucket-table tbody tr {
      border-bottom: 1px solid var(--table-row-border);
    }

    .bucket-table tbody tr:nth-child(even) {
      background: var(--table-row-even-bg);
    }

    .bucket-table tbody tr:nth-child(odd) {
      background: var(--table-row-odd-bg);
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: var(--text-sub);
    }

    .error {
      text-align: center;
      padding: 20px;
      color: var(--danger);
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(30, 64, 175, 0.7);
      border-radius: 999px;
    }

    @media (max-width: 980px) {
      body {
        padding: 12px 12px 18px;
      }
      .shell {
        height: auto;
      }
      .main-layout {
        flex-direction: column;
      }
      .panel {
        min-height: 260px;
      }
      table {
        min-width: 560px;
      }
    }
    
    @media (max-width: 768px) {
      body {
        padding: 8px;
      }
      
      .shell {
        height: auto;
        min-height: 100vh;
      }
      
      .top-bar {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;

      }
      
      .top-title-block {
        width: 100%;
      }
      
      .top-title-main {
        font-size: 16px;
      }
      
      .top-title-sub {
        font-size: 11px;
      }
      
      .top-right {

        gap: 8px;

      }
      
      .time-text {

      }
      
      .wallet-selector {

        margin-right: 0;
      }
      
      .wallet-select-btn {

      }
      
      .panel-stats-row {

        gap: 6px;
      }
      
      .chip {
        font-size: 10px;
        padding: 4px 8px;
      }
      
      .table-desktop {
        display: none !important;
      }
      
      .positions-cards {

      }
      
      .table-wrapper {

      }
      
      .panel-actions {

      }
      
      .toggle-group {
        width: 100%;
      }
      
      .toggle-btn {
        flex: 1;
      }
      
      .icon-btn {
        padding: 8px;
      }
    }
    
    @media (max-width: 480px) {
      body {
        padding: 6px;
      }
      
      .top-bar {
        padding: 10px;
      }
      
      .top-title-main {
        font-size: 14px;
      }
      
      .panel {
        padding: 10px 12px;
      }
      
      
      .chip {
        font-size: 9px;
        padding: 3px 6px;
      }
      
      .top-logo {
        width: 28px;
        height: 28px;
        font-size: 14px;
      }
    }
    
    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    
    .modal-overlay.active {
      display: flex;
      opacity: 1;
    }
    
    .modal-content {
      background: var(--panel-bg);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 24px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      transform: scale(0.95);
      transition: transform 0.2s ease;
      color: var(--text-main);

      overflow-y: auto;

      max-width: 900px;
    }

      transform: scale(1);

      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;

    }
    
    .modal-close {
      cursor: pointer;
      color: var(--text-sub);
      background: none;
      border: none;

    }
    
    .modal-body {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    
    .form-label {
      font-size: 12px;
      color: var(--text-sub);
    }
    
    .form-input {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 10px;
      color: var(--text-main);
      font-size: 14px;
    }
    
    .form-input:focus {
      outline: none;
      border-color: var(--accent);
    }
    
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .btn-primary:hover {
      background: var(--accent-strong);
    }
    
    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .icon-btn:hover {
      background: var(--toggle-bg);
      color: var(--text-main);
    }

    .btn-action {
      padding: 8px 16px;
      border-radius: 4px;
      border: 1px solid var(--accent);
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-action:hover {
      background: var(--accent);
      color: white;
    }
    
    .align-center {
      text-align: center;
    }
    
    .positions-cards {
      display: none;
    }
    
    .position-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);

      padding: 14px;
      margin-bottom: 10px;
    }
    
    .position-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      gap: 12px;
    }
    
    .position-card-title {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }
    
    .position-card-profit-badge {
      background: var(--success);
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      display: flex;
      align-items: center;

    .position-card-profit-badge.loss {

    .position-card-title-link {

    }
    
    .position-card-title-link:hover {

    .position-card-title-link:active {

    }
    
    .position-card-market {

      font-weight: 600;
      color: var(--text-main);

    .position-card-outcome {

      align-items: center;

    .position-card-stats {

    .position-card-stats-row {

    .position-card-stats-row:last-child {

    .position-card-stats-row {

    .position-card-stat-item {

      gap: 4px;

    .position-card-stat-item:first-child {

      flex: 0 0 auto;
    }
    
    .position-card-stat-item:last-child {
      text-align: right;
    }
    
    .position-card-stat-label {
      font-size: 11px;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .position-card-stat-value {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
    }
    
    .position-card-stat-value.profit {

    .position-card-stat-value.loss {
      color: var(--danger);
    }
    
    .position-card-actions {
      display: flex;

      margin-top: 12px;
      flex-wrap: wrap;
    }
    
    .position-card-actions .btn-action {

      font-size: 12px;

    @media (max-width: 768px) {

      }
      
      .position-card-header {
        flex-direction: column;

      .position-card-market {

      .position-card-stats-row {

    .wallet-selector {

      align-items: center;
      gap: 8px;

    .wallet-select-btn:hover {
      border-color: var(--accent);

    .wallet-select-btn.active {

    }
    
    .wallet-select-btn .wallet-name {

      flex: 1;

    .wallet-select-btn .wallet-address {

    .wallet-select-btn .wallet-arrow {

    .wallet-select-btn.open .wallet-arrow {

    .wallet-dropdown {

    .wallet-item:last-child {

    .wallet-item:hover {

    .wallet-item.active {

      color: var(--text-sub);

<body>
  <div class="shell">
    <header class="top-bar">
      <div class="top-title-block">
        <div class="top-logo">PM</div>
        <div class="top-title">
          <div class="top-title-main">
            Polymarket 监控面板
            <span class="tag-beta">LIVE</span>
          </div>
          <div class="top-title-sub">

          </div>
        </div>
      </div>
      <div class="top-right">

          <div class="wallet-dropdown" id="walletDropdown">
          </div>
        </div>
        <div class="pill">
          <span class="pill-dot"></span>

        <div class="toggle-group" style="margin-left:8px;">
          <button id="themeToggle" class="toggle-btn">浅色</button>
        </div>
        <span class="time-text" id="lastUpdate">最后更新：--</span>
        <button id="logoutBtn" class="icon-btn" title="登出" style="margin-left: 10px;" onclick="handleLogout()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>
    </header>

      <section class="col-left">
        <div class="panel quick-trade-panel" id="quickTradePanel">

            </div>

                    <span>S&P 500 每日涨跌</span>

                  <span class="trade-section-kicker">SPX</span>
                </div>
