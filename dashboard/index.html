                <div id="urlMarketInfoArea" class="trade-market-area">
                  <div id="marketTitle" class="trade-market-title"></div>
                  <div id="marketPrices" class="trade-price-grid"></div>
                  <div id="myPositionsInfo" class="trade-position-info"></div>
                  <div id="urlTradeArea" class="trade-entry-area" style="display: none;">
                    <div class="trade-entry-row">
                      <div>
                        <label class="trade-entry-label">金额 (pUSD)</label>
                        <input type="number" id="tradeAmountInput" class="trade-amount-input" placeholder="0" min="1" step="1">
                      </div>
                      <div id="tradeOutcomeButtons" class="trade-outcome-buttons">
                        <button class="btn-primary trade-buy-btn trade-empty-btn" disabled>先获取行情</button>
                      </div>
                    </div>
                    <div id="tradeResultArea" class="trade-result-area"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <div class="panel-title-block">
              <div class="panel-title-main">
                <span class="highlight">Polymarket 持仓</span>
              </div>
              <div class="panel-stats-rows">
                <div class="panel-stats-row">
                  <span class="chip" id="positionsWalletAddress">
                    监控钱包：<strong>0x2C9F...</strong>
                  </span>
                  <span class="chip chip-positive" id="totalAssets">
                    <span class="chip-dot"></span>
                    资产总额：<strong>-- pUSD</strong>
                  </span>
                </div>
                <div class="panel-stats-row">
                  <span class="chip" id="cashBalance">
                    现金余额：<strong>-- pUSD</strong>
                  </span>
                  <span class="chip" id="positionsValue">
                    持仓市值：<strong>-- pUSD</strong>
                  </span>
                  <span class="chip chip-positive" id="totalPnl">
                    <span class="chip-dot"></span>
                    持仓盈亏：<strong>-- pUSD</strong>
                  </span>
                </div>
              </div>
              <div class="panel-title-sub">
                市场名称 · 选项 · 平均成本 · 当前 · 盈亏金额
              </div>
            </div>
            <div class="panel-actions">
              <div class="toggle-group">
                <button class="toggle-btn active" onclick="filterPositions('current')">当前持仓</button>
                <button class="toggle-btn" onclick="filterPositions('closed')">已平仓</button>
              </div>
              <div class="chip">
                监控周期：<strong>24h</strong>
              </div>
            </div>
          </div>

          <div class="table-wrapper">
            <div class="table-scroll table-desktop">
              <table>
                <thead>
                  <tr>
                    <th class="col-market">市场名称</th>
                    <th>选项</th>
                    <th class="align-right">平均成本</th>
                    <th class="align-right sortable" onclick="sortPositions('cost')" id="sortCost">建仓成本</th>
                    <th class="align-right sortable" onclick="sortPositions('price')" id="sortPrice">当前</th>
                    <th class="align-right">盈亏金额</th>
                  </tr>
                </thead>
                <tbody id="positionsTableBody">
                  <tr>
                    <td colspan="6" class="loading">加载中...</td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class="positions-cards" id="positionsCards">
            </div>
            <div class="bucket-progress">
              <div class="bucket-progress-fill" id="positionsProgress" style="width: 0%"></div>
            </div>
            <div class="bucket-meta-row">
              <div class="bucket-meta-left">
              </div>
              <span class="text-num-sub">滑点 & 手续费已计入</span>
            </div>
          </div>
        </div>
      </section>

    </main>
  </div>

  <div class="modal-overlay" id="searchEngineModal">
    <div class="modal-content">
      <div class="modal-header">
        <span>选择搜索引擎</span>
        <button class="modal-close" onclick="closeSearchEngineSelector()">×</button>
      </div>
      <div class="modal-body">
        <div style="margin-bottom: 12px; color: var(--text-sub); font-size: 13px; text-align: center;" id="searchEngineQuery"></div>
        <div style="display: flex; flex-direction: column; gap: 12px;">
          <button class="btn-primary" onclick="openSearch('google')" style="display: flex; align-items: center; justify-content: center; gap: 8px;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Google 搜索
          </button>
          <button class="btn-primary" onclick="openSearch('bing')" style="display: flex; align-items: center; justify-content: center; gap: 8px; background: #008373; border: 1px solid #008373;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="12" r="10" fill="#008373"/>
              <path d="M8 8h8v8H8V8z" fill="#fff"/>
              <path d="M10 10h4v4h-4V10z" fill="#008373"/>
            </svg>
            Bing 搜索
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = '/api';
    let positionsData = [];
    let walletsData = [];
    let currentWalletId = null;
    let lastPositionsFetchAt = 0;
    const positionsCacheTTL = 5000;
    let refreshInFlight = false;

    async function checkAuth() {
      try {
        const resp = await fetch(`${API_BASE}/auth/check`, {
          credentials: 'include',
        });
        const data = await resp.json();
        if (!data.authenticated) {
          window.location.href = '/login';
          return false;
        }
        return true;
      } catch (error) {
        console.error('Auth check failed:', error);
        window.location.href = '/login';
        return false;
      }
    }

    async function handleLogout() {
      if (!confirm('确定要登出吗？')) {
        return;
      }
      
      try {
        const resp = await fetch(`${API_BASE}/auth/logout`, {
          method: 'POST',
          credentials: 'include',
        });
        const data = await resp.json();
        if (data.status === 'success') {
          window.location.href = '/login';
        } else {
          alert('登出失败: ' + (data.error || '未知错误'));
        }
      } catch (error) {
        console.error('Logout error:', error);
        window.location.href = '/login';
      }
    }

    function formatNumber(num, decimals = 2) {
      if (num === null || num === undefined) return '--';
      return Number(num).toFixed(decimals);
    }

    function formatTime(timestamp) {
      if (!timestamp) return '--';
      return new Date(timestamp * 1000).toLocaleString('zh-CN');
    }

    async function fetchWallets() {
      try {
        const resp = await fetch(`${API_BASE}/wallets`);
        const data = await resp.json();
        if (data.error) {
          throw new Error(data.error);
        }
        walletsData = data.wallets || [];
        currentWalletId = data.current_wallet_id;
        renderWalletSelector();
        return data;
      } catch (error) {
        console.error('Error fetching wallets:', error);
        const nameEl = document.getElementById('currentWalletName');
        const addressEl = document.getElementById('currentWalletAddress');
        if (nameEl) nameEl.textContent = '加载失败';
        if (addressEl) addressEl.textContent = error.message;
        return null;
      }
    }
    
    function renderWalletSelector() {
      const dropdown = document.getElementById('walletDropdown');
      const btn = document.getElementById('walletSelectBtn');
      const nameEl = document.getElementById('currentWalletName');
      const addressEl = document.getElementById('currentWalletAddress');
      
      if (!walletsData || walletsData.length === 0) {
        if (nameEl) nameEl.textContent = '未配置钱包';
        if (addressEl) addressEl.textContent = '--';
        if (dropdown) {
          dropdown.innerHTML = '<div class="wallet-item" style="padding: 12px; text-align: center; color: var(--text-sub);">未配置钱包</div>';
        }
        return;
      }
      
      const currentWallet = walletsData.find(w => w.id === currentWalletId) || walletsData[0];
      if (currentWallet) {
        if (nameEl) nameEl.textContent = currentWallet.name;
        if (addressEl) {
          const addr = currentWallet.address;
          addressEl.textContent = `${addr.substring(0, 6)}...${addr.substring(addr.length - 4)}`;
        }
        if (btn) {
          if (currentWallet.is_current) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        }
      }
      
      if (dropdown) {
        dropdown.innerHTML = walletsData.map(wallet => `
          <div class="wallet-item ${wallet.is_current ? 'active' : ''}" onclick="switchWallet('${wallet.id}')">
            <div class="wallet-item-name">${wallet.name} ${wallet.is_current ? '✓' : ''}</div>
            <div class="wallet-item-address">${wallet.address}</div>
          </div>
        `).join('');
      }
    }
    
    function toggleWalletDropdown() {
      const dropdown = document.getElementById('walletDropdown');
      const btn = document.getElementById('walletSelectBtn');
      if (!dropdown || !btn) return;
      
      const isOpen = dropdown.classList.contains('show');
      
      if (isOpen) {
        dropdown.classList.remove('show');
        btn.classList.remove('open');
      } else {
        const btnRect = btn.getBoundingClientRect();
        dropdown.style.position = 'fixed';
        dropdown.style.top = (btnRect.bottom + 4) + 'px';
        dropdown.style.left = btnRect.left + 'px';
        dropdown.style.width = Math.max(btnRect.width, 200) + 'px';
        dropdown.style.zIndex = '99999';
        
        const dropdownHeight = 300; // max-height
        if (btnRect.bottom + dropdownHeight + 4 > window.innerHeight) {
          dropdown.style.top = (btnRect.top - dropdownHeight - 4) + 'px';
        }
        
        dropdown.classList.add('show');
        btn.classList.add('open');
      }
    }
    
    async function switchWallet(walletId) {
      try {
        const resp = await fetch(`${API_BASE}/wallets/switch`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ wallet_id: walletId }),
        });
        const data = await resp.json();
        if (data.error) {
          throw new Error(data.error);
        }
        
        currentWalletId = walletId;
        
        const dropdown = document.getElementById('walletDropdown');
        const btn = document.getElementById('walletSelectBtn');
        if (dropdown) dropdown.classList.remove('show');
        if (btn) btn.classList.remove('open');
        
        await fetchWallets();
        lastPositionsFetchAt = 0;
        await fetchPositions(true);
      } catch (error) {
        console.error('Error switching wallet:', error);
        alert('切换钱包失败: ' + error.message);
      }
    }
    
    document.addEventListener('click', (e) => {
      const selector = document.getElementById('walletSelector');
      if (selector && !selector.contains(e.target)) {
        const dropdown = document.getElementById('walletDropdown');
        const btn = document.getElementById('walletSelectBtn');
        if (dropdown) dropdown.classList.remove('show');
        if (btn) btn.classList.remove('open');
      }
    });
    
    async function fetchPositions(forceRefresh = false) {
      try {
        const url = forceRefresh ? `${API_BASE}/positions?t=${Date.now()}` : `${API_BASE}/positions`;
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 4500);
        const resp = await fetch(url, { signal: controller.signal });
        clearTimeout(timeoutId);
        const data = await resp.json();
        if (data.error) {
          throw new Error(data.error);
        }
        positionsData = data.positions || [];
        lastPositionsFetchAt = Date.now();
        renderPositions();
        updatePositionsStats(data);
        return data;
      } catch (error) {
        console.error('Error fetching positions:', error);
        const tbody = document.getElementById('positionsTableBody');
        const cardsContainer = document.getElementById('positionsCards');
        const isMobile = window.innerWidth <= 768;
        if (isMobile && cardsContainer) {
          cardsContainer.innerHTML = `<div class="error" style="text-align: center; padding: 40px;">加载失败: ${error.message}</div>`;
        } else if (tbody) {
          tbody.innerHTML = `<tr><td colspan=\"6\" class=\"error\">加载失败: ${error.message}</td></tr>`;
        }
        return null;
      }
    }

    let sortColumn = null;
    let sortDirection = 'asc'; // 'asc' or 'desc'

    function sortPositions(column) {
      const tbody = document.getElementById('positionsTableBody');
      const rows = Array.from(tbody.querySelectorAll('tr'));
      
      document.querySelectorAll('th.sortable').forEach(th => {
        th.classList.remove('sort-asc', 'sort-desc');
      });
      
      if (sortColumn === column) {
        sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
      } else {
        sortColumn = column;
        sortDirection = 'asc';
      }
      
      const sortHeader = document.getElementById(column === 'cost' ? 'sortCost' : 'sortPrice');
      if (sortHeader) {
        sortHeader.classList.add(sortDirection === 'asc' ? 'sort-asc' : 'sort-desc');
      }
      
      rows.sort((a, b) => {
        let aVal, bVal;
        
        if (column === 'cost') {
          aVal = parseFloat(a.querySelector('td[data-sort-cost]')?.getAttribute('data-sort-cost') || '0');
          bVal = parseFloat(b.querySelector('td[data-sort-cost]')?.getAttribute('data-sort-cost') || '0');
        } else if (column === 'price') {
          aVal = parseFloat(a.querySelector('td[data-sort-price]')?.getAttribute('data-sort-price') || '-1');
          bVal = parseFloat(b.querySelector('td[data-sort-price]')?.getAttribute('data-sort-price') || '-1');
        } else {
          return 0;
        }
        
        if (sortDirection === 'asc') {
          return aVal - bVal;
        } else {
          return bVal - aVal;
        }
      });
      
      rows.forEach(row => tbody.appendChild(row));
    }

    function renderPositions() {
      const tbody = document.getElementById('positionsTableBody');
      const cardsContainer = document.getElementById('positionsCards');
      const isMobile = window.innerWidth <= 768;
      
      if (positionsData.length === 0) {
        if (isMobile && cardsContainer) {
          cardsContainer.innerHTML = '<div class="loading" style="text-align: center; padding: 40px;">暂无持仓</div>';
        } else if (tbody) {
          tbody.innerHTML = '<tr><td colspan=\"6\" class=\"loading\">暂无持仓</td></tr>';
        }
        return;
      }
      
      sortColumn = null;
      sortDirection = 'asc';
      document.querySelectorAll('th.sortable').forEach(th => {
        th.classList.remove('sort-asc', 'sort-desc');
      });

      if (isMobile && cardsContainer) {
        cardsContainer.style.display = 'block';
        const tableDesktop = document.querySelector('.table-desktop');
        if (tableDesktop) {
          tableDesktop.style.display = 'none';
        }
        cardsContainer.innerHTML = positionsData.map(pos => {
          const pnl = pos.pnl || 0;
          const pnlPercent = pos.pnl_percent || 0;
          const pnlClass = pnl >= 0 ? 'profit' : 'loss';
          const pnlSign = pnl >= 0 ? '+' : '';
          
          const currentPrice = pos.current_price !== null ? formatNumber(pos.current_price, 2) : '--';
          const avgCost = pos.avg_cost || 0;
          const buildCost = avgCost * (pos.size || 0);
          const buildSize = pos.size || 0;
          
          const searchQuery = encodeURIComponent(pos.market_title || pos.token_id);
          
          return `
            <div class="position-card">
              <div class="position-card-header">
                <div class="position-card-title">
                  <div onclick="showSearchEngineSelector('${searchQuery}', '${pos.market_title || `Token ${pos.token_id.substring(0, 16)}...`}')" class="position-card-title-link" style="cursor: pointer;">
                    <div class="position-card-market">${pos.market_title || `Token ${pos.token_id.substring(0, 16)}...`}</div>
                  </div>
                  <span class="position-card-outcome">
                    <span class="pill-outcome-dot"></span>
                    ${pos.outcome || 'N/A'}
                  </span>
                </div>
                <div class="position-card-profit-badge ${pnlClass}">
                  ${pnlSign}${formatNumber(pnl, 2)} PROFIT
                </div>
              </div>
              
              <div class="position-card-stats">
                <div class="position-card-stats-row">
                  <div class="position-card-stat-item">
                    <div class="position-card-stat-label">当前</div>
                    <div class="position-card-stat-value">${currentPrice}</div>
                  </div>
                  <div class="position-card-stat-item">
                    <div class="position-card-stat-label">均价</div>
                    <div class="position-card-stat-value">${formatNumber(avgCost, 2)}</div>
                  </div>
                  <div class="position-card-stat-item">
                    <div class="position-card-stat-label">数量</div>
                    <div class="position-card-stat-value">${formatNumber(buildSize, 0)}</div>
                  </div>
                </div>
              </div>
              
              <div class="position-card-actions">
                <button class="btn-action" onclick="sellPosition('${pos.token_id}', 0.25)">25%</button>
                <button class="btn-action" onclick="sellPosition('${pos.token_id}', 0.50)">50%</button>
                <button class="btn-action" onclick="sellPosition('${pos.token_id}', 0.75)">75%</button>
                <button class="btn-action" style="background:var(--danger); color:white; border-color:var(--danger);" onclick="sellPosition('${pos.token_id}', 1.0)">全仓</button>
              </div>
              
              <div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--text-sub);">
                <span>含滑点/手续费</span>
                <span class="${pnlClass === 'profit' ? 'text-profit' : 'text-loss'}" style="font-weight: 600;">
                  ${pnlPercent >= 0 ? '+' : '-'} ${Math.abs(pnlPercent).toFixed(1)}%
                </span>
              </div>
            </div>
          `;
        }).join('');
        return;
      }

      if (tbody) {
        const tableDesktop = document.querySelector('.table-desktop');
        if (tableDesktop) {
          tableDesktop.style.display = 'block';
        }
        if (cardsContainer) {
          cardsContainer.style.display = 'none';
        }
        tbody.innerHTML = positionsData.map(pos => {
        const pnl = pos.pnl || 0;
        const pnlPercent = pos.pnl_percent || 0;
        const pnlClass = pnl >= 0 ? 'text-profit' : 'text-loss';
        const pnlSign = pnl >= 0 ? '+' : '';
        
        const currentPrice = pos.current_price !== null ? formatNumber(pos.current_price, 2) : '--';
        const priceChange = pos.current_price !== null && pos.avg_cost > 0 
          ? (pos.current_price - pos.avg_cost).toFixed(2) 
          : '--';
        const priceChangeClass = pos.current_price !== null && pos.current_price > pos.avg_cost 
          ? 'text-profit' 
          : pos.current_price !== null && pos.current_price < pos.avg_cost 
          ? 'text-loss' 
          : 'text-muted';

        const searchQuery = encodeURIComponent(pos.market_title || pos.token_id);
        const searchUrl = `https://www.google.com/search?q=${searchQuery}`;
        
        return `
          <tr>
            <td class="col-market">
              <div class="market-name">
                <a href="${searchUrl}" target="_blank" class="market-title-link" title="点击在 Google 中搜索此市场">
                  <span class="market-title">${pos.market_title || `Token ${pos.token_id.substring(0, 16)}...`}</span>
                </a>
                <span class="market-sub">Token: ${pos.token_id.substring(0, 20)}...</span>
                ${pos.market_id ? `<span class="market-sub">Market: ${pos.market_id}</span>` : ''}
                ${pos.slug ? `<span class="market-sub">Slug: ${pos.slug}</span>` : ''}
                <div style="margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;">
                  <button class="btn-action" onclick="sellPosition('${pos.token_id}', 0.25)">25%</button>
                  <button class="btn-action" onclick="sellPosition('${pos.token_id}', 0.50)">50%</button>
                  <button class="btn-action" onclick="sellPosition('${pos.token_id}', 0.75)">75%</button>
                  <button class="btn-action" style="background:var(--danger); color:white; border-color:var(--danger);" onclick="sellPosition('${pos.token_id}', 1.0)">全仓</button>
                </div>
              </div>
            </td>
            <td>
              <span class="pill-outcome">
                <span class="pill-outcome-dot"></span>
                ${pos.outcome || 'N/A'}
              </span>
            </td>
            <td class="align-right">
              ${formatNumber(pos.avg_cost, 2)}
              <div class="text-num-sub">建仓数：${formatNumber(pos.size, 0)}</div>
            </td>
            <td class="align-right" data-sort-cost="${(pos.avg_cost || 0) * (pos.size || 0)}">
              ${formatNumber((pos.avg_cost || 0) * (pos.size || 0), 2)}
            </td>
            <td class="align-right" data-sort-price="${pos.current_price !== null ? pos.current_price : -1}">
              ${currentPrice}
              <div class="text-num-sub ${priceChangeClass}">变动 ${priceChange}</div>
            </td>
            <td class="align-right">
              <span class="${pnlClass}">${pnlSign}${formatNumber(pnl, 2)}</span>
              <div class="text-num-sub ${pnlClass}">${pnlSign}${formatNumber(pnlPercent, 1)}%</div>
            </td>
          </tr>
        `;
      }).join('');
      }
    }
    
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (positionsData.length > 0) {
          renderPositions();
        }
      }, 250);
    });

    function updatePositionsStats(data) {
      const wallet = data.wallet || {};
      const walletAddress = wallet.address || data.wallet_address || '';
      const walletName = wallet.name || '';
      const shortAddress = walletAddress.length > 10 
        ? `${walletAddress.substring(0, 6)}...${walletAddress.substring(walletAddress.length - 4)}`
        : walletAddress;
      const walletDisplay = walletName ? `${walletName} (${shortAddress})` : shortAddress;
      document.getElementById('positionsWalletAddress').innerHTML = `
        监控钱包：<strong>${walletDisplay}</strong>`;
      
      const totalPnl = data.total_pnl || 0;
      const totalPnlEl = document.getElementById('totalPnl');
      totalPnlEl.innerHTML = `
        <span class=\"chip-dot\"></span>
        持仓盈亏：<strong>${totalPnl >= 0 ? '+' : ''}${formatNumber(totalPnl, 2)} pUSD</strong>
      `;
      totalPnlEl.className = totalPnl >= 0 ? 'chip chip-positive' : 'chip chip-negative';
      const cashBalanceEl = document.getElementById('cashBalance');
      if (cashBalanceEl) {
        const cashBalance = data.cash_balance ?? data.cashBalance;
        const cashText = cashBalance === null || cashBalance === undefined
          ? '--'
          : formatNumber(cashBalance, 2);
        cashBalanceEl.innerHTML = `现金余额：<strong>${cashText} pUSD</strong>`;
      }

      const positionsValueEl = document.getElementById('positionsValue');
      if (positionsValueEl) {
        const positionsValue = data.positions_value ?? data.positionsValue;
        const positionsText = positionsValue === null || positionsValue === undefined
          ? '--'
          : formatNumber(positionsValue, 2);
        positionsValueEl.innerHTML = `持仓市值：<strong>${positionsText} pUSD</strong>`;
      }

      const totalAssetsEl = document.getElementById('totalAssets');
      if (totalAssetsEl) {
        const cashBalance = data.cash_balance ?? data.cashBalance;
        const positionsValue = data.positions_value ?? data.positionsValue;
        
        if (cashBalance !== null && cashBalance !== undefined && positionsValue !== null && positionsValue !== undefined) {
          const totalAssets = cashBalance + positionsValue;
          totalAssetsEl.innerHTML = `
            <span class=\"chip-dot\"></span>
            资产总额：<strong>${formatNumber(totalAssets, 2)} pUSD</strong>`;
          totalAssetsEl.className = 'chip chip-positive';
        } else {
          totalAssetsEl.innerHTML = `
            <span class=\"chip-dot\"></span>
            资产总额：<strong>-- pUSD</strong>`;
          totalAssetsEl.className = 'chip';
        }
      }

      const maxPnl = Math.max(...positionsData.map(p => Math.abs(p.pnl_percent || 0)), 1);
      const progress = positionsData.length > 0 
        ? positionsData.filter(p => (p.pnl || 0) > 0).length / positionsData.length * 100 
        : 0;
      document.getElementById('positionsProgress').style.width = `${progress}%`;
    }

    function filterPositions(type) {
      document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
    }


    function updateLastUpdateTime() {
      const now = new Date();
      document.getElementById('lastUpdate').textContent = `
        最后更新：${now.toLocaleString('zh-CN')}`;
    }

    let currentMarketData = null;  // URL列的市场数据
    let currentSpxMarketData = null;  // SPX列的市场数据
    let quickTradeCollapseTimer = null;

    (function initSpxDate() {
      const dateInput = document.getElementById('spxDateInput');
      if (!dateInput) return;

      const now = new Date();
      const etNow = new Date(now.toLocaleString('en-US', { timeZone: 'America/New_York' }));
      const etHour = etNow.getHours();
      const etMin = etNow.getMinutes();

      let targetDate = new Date(etNow);
      if (etHour > 17 || (etHour === 17 && etMin >= 30)) {
        targetDate.setDate(targetDate.getDate() + 1);
      }
      while (targetDate.getDay() === 0 || targetDate.getDay() === 6) {
        targetDate.setDate(targetDate.getDate() + 1);
      }

      const yyyy = targetDate.getFullYear();
      const mm = String(targetDate.getMonth() + 1).padStart(2, '0');
      const dd = String(targetDate.getDate()).padStart(2, '0');
      dateInput.value = `${yyyy}-${mm}-${dd}`;

      scheduleSpxAutoSwitch();
    })();

    function scheduleSpxAutoSwitch() {
      const now = new Date();

      const etStr = now.toLocaleString('en-US', { timeZone: 'America/New_York' });
      const etNow = new Date(etStr);

      const et1730Today = new Date(etNow);
      et1730Today.setHours(17, 30, 0, 0);

      let msUntil1730 = et1730Today.getTime() - etNow.getTime();
      if (msUntil1730 <= 0) {
        msUntil1730 += 24 * 60 * 60 * 1000;
      }

      msUntil1730 = Math.max(msUntil1730 - 5000, 1000);

      setTimeout(() => {
        const checkNow = new Date();
        const checkEtStr = checkNow.toLocaleString('en-US', { timeZone: 'America/New_York' });
        const checkEt = new Date(checkEtStr);
        const checkTotalMin = checkEt.getHours() * 60 + checkEt.getMinutes();

        if (checkTotalMin >= 17 * 60 + 30) {
          const dateInput = document.getElementById('spxDateInput');
          if (dateInput) {
            let nextDate = new Date(checkEt);
            nextDate.setDate(nextDate.getDate() + 1);
            while (nextDate.getDay() === 0 || nextDate.getDay() === 6) {
              nextDate.setDate(nextDate.getDate() + 1);
            }
            const yyyy = nextDate.getFullYear();
            const mm = String(nextDate.getMonth() + 1).padStart(2, '0');
            const dd = String(nextDate.getDate()).padStart(2, '0');
            dateInput.value = `${yyyy}-${mm}-${dd}`;
            fetchSpxMarketData();
          }
        }

        scheduleSpxAutoSwitch();
      }, msUntil1730);
    }

    function setQuickTradeExpanded(expanded) {
      const panel = document.getElementById('quickTradePanel');
      if (!panel) return;
      panel.classList.toggle('is-expanded', expanded);
    }

    function resetQuickTradePanel(delayMs = 0) {
      if (quickTradeCollapseTimer) {
        clearTimeout(quickTradeCollapseTimer);
        quickTradeCollapseTimer = null;
      }

      const collapse = () => {
        currentMarketData = null;
        setQuickTradeExpanded(false);
        const resultArea = document.getElementById('tradeResultArea');
        const amountInput = document.getElementById('tradeAmountInput');
        const pricesEl = document.getElementById('marketPrices');
        const posEl = document.getElementById('myPositionsInfo');
        const titleEl = document.getElementById('marketTitle');
        const tradeArea = document.getElementById('urlTradeArea');
        if (resultArea) resultArea.innerHTML = '';
        if (amountInput) amountInput.value = '';
        if (pricesEl) pricesEl.innerHTML = '';
        if (posEl) posEl.innerHTML = '';
        if (titleEl) { titleEl.textContent = ''; titleEl.style.display = 'none'; }
        if (tradeArea) tradeArea.style.display = 'none';
        renderTradeOutcomeButtons([]);
      };

      if (delayMs > 0) {
        quickTradeCollapseTimer = setTimeout(collapse, delayMs);
      } else {
        collapse();
      }
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function resetSpxPanel() {
      currentSpxMarketData = null;
      const urlEl = document.getElementById('spxMarketUrl');
      const pricesEl = document.getElementById('spxMarketPrices');
      const posEl = document.getElementById('spxMyPositionsInfo');
      const titleEl = document.getElementById('spxMarketTitle');
      const tradeArea = document.getElementById('spxTradeArea');
      const amountInput = document.getElementById('spxTradeAmountInput');
      const resultArea = document.getElementById('spxTradeResultArea');
      if (urlEl) { urlEl.innerHTML = ''; urlEl.style.display = 'none'; }
      if (pricesEl) pricesEl.innerHTML = '';
      if (posEl) posEl.innerHTML = '';
      if (titleEl) { titleEl.textContent = ''; titleEl.style.display = 'none'; }
      if (tradeArea) tradeArea.style.display = 'none';
      if (amountInput) amountInput.value = '';
      if (resultArea) resultArea.innerHTML = '';
      renderSpxTradeOutcomeButtons([]);
    }

    function getOutcomeAccent(outcomeName, index) {
      const normalized = String(outcomeName || '').trim().toUpperCase();
      if (normalized.includes('UP') || normalized.includes('上涨') || normalized === 'YES') return 'var(--success)';
      if (normalized.includes('DOWN') || normalized.includes('下跌') || normalized === 'NO') return 'var(--danger)';
      return index % 2 === 0 ? 'var(--success)' : 'var(--danger)';
    }

    function getOutcomeTradePrice(outcome) {
      return outcome?.best_ask || outcome?.midpoint || null;
    }

    function renderOutcomePriceCard(oc, index, showSpread = false) {
      const accent = getOutcomeAccent(oc.name, index);
      const name = escapeHtml(oc.name || `Outcome ${index + 1}`);
      const bidStr = oc.best_bid !== null ? (oc.best_bid * 100).toFixed(1) + '¢' : '--';
      const askStr = oc.best_ask !== null ? (oc.best_ask * 100).toFixed(1) + '¢' : '--';
      const midStr = oc.midpoint !== null ? (oc.midpoint * 100).toFixed(1) + '¢' : '--';
      const spreadStr = showSpread && oc.spread !== null ? `${(oc.spread * 100).toFixed(1)}¢` : null;
      return `
        <div class="trade-price-card">
          <div class="trade-price-label">
            <span class="trade-price-dot" style="background: ${accent};"></span>
            <span class="trade-price-name">${name}</span>
          </div>
          <div class="trade-price-main">${midStr}</div>
          <div class="trade-price-meta">
            <span>买 ${bidStr}</span>
            <span>卖 ${askStr}</span>
            ${spreadStr ? `<span class="spread">价差 ${spreadStr}</span>` : ''}
          </div>
        </div>
      `;
    }

    function renderTradeButtons(outcomes, onClickName) {
      if (!outcomes.length) {
        return '<button class="btn-primary trade-buy-btn trade-empty-btn" disabled>暂无可交易选项</button>';
      }

      return outcomes.map((oc, index) => {
        const name = escapeHtml(oc.name || `Outcome ${index + 1}`);
        const accent = getOutcomeAccent(oc.name, index);
        const price = getOutcomeTradePrice(oc);
        const priceText = price ? `${(price * 100).toFixed(1)}¢` : '--';
        const disabled = !oc.token_id || !price;
        return `
          <button
            type="button"
            class="btn-primary trade-buy-btn"
            onclick="${onClickName}(${index})"
            ${disabled ? 'disabled' : ''}
            title="买入 ${name}"
            style="background: ${accent}; border-color: ${accent}; opacity: ${disabled ? '0.55' : '1'};"
          >
            <span>买入 ${name}</span>
            <span class="price">${priceText}</span>
          </button>
        `;
      }).join('');
    }

    async function fetchSpxMarketData() {
      const dateInput = document.getElementById('spxDateInput');
      const dateValue = dateInput ? dateInput.value.trim() : '';
      if (!dateValue) {
        alert('请选择日期');
        return;
      }

      resetSpxPanel();

      const btn = document.getElementById('fetchSpxBtn');
      const panel = document.getElementById('quickTradePanel');
      btn.textContent = '获取中...';
      btn.disabled = true;
      if (panel) panel.classList.add('is-loading');

      try {
        const resp = await fetch(`${API_BASE}/market/spx`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ date: dateValue })
        });
        const data = await resp.json();

        if (!resp.ok || data.error) {
          alert(data.error || '获取SPX市场信息失败');
          return;
        }

        currentSpxMarketData = data;
        renderSpxMarketInfo(data);
      } catch (e) {
        alert('网络错误: ' + e.message);
      } finally {
        btn.textContent = '获取行情';
        btn.disabled = false;
        if (panel) panel.classList.remove('is-loading');
      }
    }

    function renderSpxMarketInfo(data) {
      const urlEl = document.getElementById('spxMarketUrl');
      if (data.event_url) {
        urlEl.innerHTML = `<a href="${escapeHtml(data.event_url)}" target="_blank" rel="noopener" style="color: var(--accent); text-decoration: none;">${escapeHtml(data.event_url)}</a>`;
        urlEl.style.display = 'block';
      } else {
        urlEl.innerHTML = '';
        urlEl.style.display = 'none';
      }

      const titleEl = document.getElementById('spxMarketTitle');
      titleEl.textContent = data.market_title || `S&P 500 ${data.date}`;
      titleEl.style.display = 'block';

      const pricesEl = document.getElementById('spxMarketPrices');
      pricesEl.innerHTML = (data.outcomes || []).map((oc, index) => {
        return renderOutcomePriceCard(oc, index);
      }).join('');

      const posEl = document.getElementById('spxMyPositionsInfo');
      if (data.my_positions && data.my_positions.length > 0) {
        posEl.innerHTML = '<strong style="color:var(--warning);">持仓:</strong> ' + data.my_positions.map(p =>
          `${p.outcome}: ${formatNumber(p.size, 2)} @ ${(p.avg_cost * 100).toFixed(1)}¢`
        ).join(' · ');
      } else {
        posEl.innerHTML = '<span style="opacity:0.6;">无持仓</span>';
      }

      const tradeArea = document.getElementById('spxTradeArea');
      if (tradeArea) tradeArea.style.display = 'block';

      renderSpxTradeOutcomeButtons(data.outcomes || []);
    }

    function renderSpxTradeOutcomeButtons(outcomes) {
      const buttonsEl = document.getElementById('spxTradeOutcomeButtons');
      if (!buttonsEl) return;

      if (!outcomes.length) {
        buttonsEl.innerHTML = renderTradeButtons([], 'placeSpxTradeByIndex');
        return;
      }

      buttonsEl.innerHTML = renderTradeButtons(outcomes, 'placeSpxTradeByIndex');
    }

    async function placeSpxTradeByIndex(outcomeIndex) {
      if (!currentSpxMarketData || !Array.isArray(currentSpxMarketData.outcomes)) {
        alert('请先获取SPX市场信息');
        return;
      }
      const outcome = currentSpxMarketData.outcomes[outcomeIndex];
      if (!outcome || !outcome.name) {
        alert('未找到对应的交易选项');
        return;
      }
      return placeTradeGeneric(currentSpxMarketData, outcome, 'spxTradeAmountInput', 'spxTradeResultArea', () => resetSpxPanel());
    }

    async function fetchMarketData() {
      if (quickTradeCollapseTimer) {
        clearTimeout(quickTradeCollapseTimer);
        quickTradeCollapseTimer = null;
      }
      const urlInput = document.getElementById('marketUrlInput');
      const url = urlInput.value.trim();
      if (!url) {
        alert('请输入 Polymarket 市场链接');
        return;
      }
      resetQuickTradePanel();

      const btn = document.getElementById('fetchMarketBtn');
      const panel = document.getElementById('quickTradePanel');
      btn.textContent = '获取中...';
      btn.disabled = true;
      if (panel) panel.classList.add('is-loading');

      try {
        const resp = await fetch(`${API_BASE}/market/fetch`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ url })
        });
        const data = await resp.json();

        if (!resp.ok || data.error) {
          alert(data.error || '获取市场信息失败');
          return;
        }

        currentMarketData = data;
        renderMarketInfo(data);
      } catch (e) {
        alert('网络错误: ' + e.message);
      } finally {
        btn.textContent = '获取行情';
        btn.disabled = false;
        if (panel) panel.classList.remove('is-loading');
      }
    }

    function renderMarketInfo(data) {
      const titleEl = document.getElementById('marketTitle');
      titleEl.textContent = data.market_title || '未知市场';
      titleEl.style.display = 'block';

      const pricesEl = document.getElementById('marketPrices');
      pricesEl.innerHTML = (data.outcomes || []).map((oc, index) => {
        return renderOutcomePriceCard(oc, index, true);
      }).join('');

      renderTradeOutcomeButtons(data.outcomes || []);

      const tradeArea = document.getElementById('urlTradeArea');
      if (tradeArea) tradeArea.style.display = 'block';

      const posEl = document.getElementById('myPositionsInfo');
      if (data.my_positions && data.my_positions.length > 0) {
        posEl.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" style="vertical-align:middle;margin-right:4px;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg><strong style="color:var(--accent);">当前持仓:</strong> ' + data.my_positions.map(p =>
          `${p.outcome}: ${formatNumber(p.size, 2)} @ ${(p.avg_cost * 100).toFixed(1)}¢`
        ).join(' · ');
      } else {
        posEl.innerHTML = '<span style="opacity:0.6;">当前钱包在此市场无持仓</span>';
      }
    }

    function renderTradeOutcomeButtons(outcomes) {
      const buttonsEl = document.getElementById('tradeOutcomeButtons');
      if (!buttonsEl) return;

      if (!outcomes.length) {
        buttonsEl.innerHTML = renderTradeButtons([], 'placeTradeByIndex');
        return;
      }

      buttonsEl.innerHTML = renderTradeButtons(outcomes, 'placeTradeByIndex');
    }

    async function placeTradeByIndex(outcomeIndex) {
      if (!currentMarketData || !Array.isArray(currentMarketData.outcomes)) {
        alert('请先获取市场信息');
        return;
      }
      const outcome = currentMarketData.outcomes[outcomeIndex];
      if (!outcome || !outcome.name) {
        alert('未找到对应的交易选项');
        return;
      }
      return placeTradeGeneric(currentMarketData, outcome, 'tradeAmountInput', 'tradeResultArea', () => resetQuickTradePanel(1600));
    }

    async function placeTradeGeneric(marketData, outcome, amountInputId, resultAreaId, onTradeSuccess) {
      if (!outcome || !outcome.token_id) {
        alert(`未找到 ${outcome.name} 的交易 token`);
        return;
      }

      const amountInput = document.getElementById(amountInputId);
      const amountPUSD = parseFloat(amountInput.value);
      if (!amountPUSD || amountPUSD <= 0) {
        alert('请输入有效的交易金额');
        return;
      }

      const price = outcome.best_ask || outcome.midpoint;
      if (!price || price <= 0) {
        alert('无法获取有效价格，请重试');
        return;
      }
      const size = amountPUSD / price;

      if (!confirm(`确认买入 ${outcome.name}?\n金额: ${amountPUSD.toFixed(2)} pUSD\n预估份额: ${size.toFixed(4)}\n价格: ${(price * 100).toFixed(1)}¢`)) {
        return;
      }

      const resultArea = document.getElementById(resultAreaId);
      resultArea.innerHTML = '<div style="color: var(--text-sub); font-size: 12px;">下单中...</div>';

      try {
        const resp = await fetch(`${API_BASE}/trade/place`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            token_id: outcome.token_id,
            side: 'BUY',
            size: size,
            price: price
          })
        });
        const data = await resp.json();

        if (!resp.ok || data.error) {
          resultArea.innerHTML = `<div style="color: var(--danger); font-size: 12px; background: rgba(239,68,68,0.08); padding: 8px 10px; border-radius: 6px;">下单失败: ${data.error || '未知错误'}</div>`;
          return;
        }

        resultArea.innerHTML = `
          <div style="background: rgba(34,197,94,0.06); border: 1px solid rgba(34,197,94,0.25); border-radius: 8px; padding: 10px 12px; font-size: 12px;">
            <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 6px;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
              <span style="font-weight: 700; color: var(--success);">下单成功</span>
            </div>
            <div style="color: var(--text-sub); line-height: 1.6; font-size: 11px;">
              <div style="display: flex; justify-content: space-between;"><span>方向</span><strong style="color: var(--text-main);">${outcome.name}</strong></div>
              <div style="display: flex; justify-content: space-between;"><span>份额</span><strong style="color: var(--text-main);">${formatNumber(data.size, 4)}</strong></div>
              <div style="display: flex; justify-content: space-between;"><span>价格</span><strong style="color: var(--text-main);">${(data.price * 100).toFixed(1)}¢</strong></div>
              <div style="margin-top: 4px; font-family: monospace; font-size: 9px; color: var(--text-sub); word-break: break-all;">Order: ${data.order_id || '--'}</div>
            </div>
          </div>
        `;

        await fetchPositions();
        if (onTradeSuccess) onTradeSuccess();
      } catch (e) {
        resultArea.innerHTML = `
          <div style="background: rgba(239,68,68,0.06); border: 1px solid rgba(239,68,68,0.25); border-radius: 8px; padding: 10px 12px; font-size: 12px;">
            <div style="display: flex; align-items: center; gap: 6px;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>
              <span style="font-weight: 700; color: var(--danger);">网络错误</span>
            </div>
            <div style="margin-top: 4px; font-size: 11px; color: var(--text-sub);">${e.message}</div>
          </div>
        `;
      }
    }

    async function refreshAll() {
      if (refreshInFlight) return;
      refreshInFlight = true;
      updateLastUpdateTime();
      try {
        await fetchWallets();
        await fetchPositions();
      } finally {
        refreshInFlight = false;
      }
    }

    (async function init() {
      const isAuthenticated = await checkAuth();
      if (!isAuthenticated) {
        return; // 已重定向到登录页
      }
      
      refreshAll();
      
      setInterval(refreshAll, 5000); // 5 秒刷新一次
      
      (function() {
        var saved = localStorage.getItem('pm_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', saved);
        var btn = document.getElementById('themeToggle');
        if (btn) {
          btn.textContent = saved === 'light' ? '深色' : '浅色';
          btn.addEventListener('click', function() {
            var current = document.documentElement.getAttribute('data-theme') || 'dark';
            var next = current === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('pm_theme', next);
            btn.textContent = next === 'light' ? '深色' : '浅色';
          });
        }
      })();
    })();

    async function sellPosition(tokenId, percentage) {
      const label = percentage === 1.0 ? '全仓' : `${percentage * 100}%`;
      if (!confirm(`确认要卖出 ${label} 持仓？`)) return;
      
      try {
        const resp = await fetch(`${API_BASE}/trade/sell`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          credentials: 'include', // 包含 session cookie
          body: JSON.stringify({ token_id: tokenId, percentage: percentage })
        });
        
        const data = await resp.json();
        if (resp.ok) {
          alert(`成功: ${data.message}`);
          await fetchPositions(true);
        } else {
          if (resp.status === 401) {
            alert('会话已过期，请重新登录');
            window.location.href = '/login';
          } else {
            alert(`错误: ${data.error}`);
          }
        }
      } catch (e) {
        alert(`网络错误: ${e.message}`);
      }
    }

    let currentSearchQuery = '';
    let currentSearchTitle = '';

    function showSearchEngineSelector(query, title) {
      currentSearchQuery = query;
      currentSearchTitle = title;
      const modal = document.getElementById('searchEngineModal');
      const queryEl = document.getElementById('searchEngineQuery');
      if (queryEl) {
        queryEl.textContent = `搜索: ${decodeURIComponent(title)}`;
      }
      if (modal) {
        modal.classList.add('active');
      }
    }

    function closeSearchEngineSelector() {
      const modal = document.getElementById('searchEngineModal');
      if (modal) {
        modal.classList.remove('active');
      }
      currentSearchQuery = '';
      currentSearchTitle = '';
    }

    function openSearch(engine) {
      if (!currentSearchQuery) {
        closeSearchEngineSelector();
        return;
      }

      let searchUrl = '';
      if (engine === 'google') {
        searchUrl = `https://www.google.com/search?q=${currentSearchQuery}`;
      } else if (engine === 'bing') {
        searchUrl = `https://www.bing.com/search?q=${currentSearchQuery}`;
      }

      if (searchUrl) {
        window.open(searchUrl, '_blank');
        closeSearchEngineSelector();
      }
    }

    document.addEventListener('click', (e) => {
      const modal = document.getElementById('searchEngineModal');
      if (modal && e.target === modal) {
        closeSearchEngineSelector();
      }
    });
    
  </script>
