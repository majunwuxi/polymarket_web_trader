<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>登录 - Polymarket 监控面板</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #050816;
      --bg-elevated: #0f172a;
      --accent: #38bdf8;
      --accent-strong: #0ea5e9;
      --text-main: #e5e7eb;
      --text-sub: #9ca3af;
      --danger: #f97373;
      --success: #4ade80;
      --border-subtle: rgba(148, 163, 184, 0.25);
      --radius-lg: 18px;
      --shadow-soft: 0 18px 45px rgba(15, 23, 42, 0.7);
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.18), transparent 55%),
        radial-gradient(circle at bottom right, rgba(129, 140, 248, 0.18), transparent 55%),
        var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow-soft);
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-header h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .login-header p {
      font-size: 14px;
      color: var(--text-sub);
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .form-input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 15px;
      transition: all 0.2s;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1);
    }

    .form-input::placeholder {
      color: var(--text-sub);
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }

    .btn-primary:hover {
      background: var(--accent-strong);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .error-message {
      background: rgba(249, 115, 115, 0.1);
      border: 1px solid rgba(249, 115, 115, 0.3);
      color: var(--danger);
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .success-message {
      background: rgba(74, 222, 128, 0.1);
      border: 1px solid rgba(74, 222, 128, 0.3);
      color: var(--success);
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
    }

    .success-message.show {
      display: block;
    }

    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .info-text {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 16px;
      text-align: center;
    }
    
    /* 移动端适配 */
    @media (max-width: 768px) {
      body {
        padding: 16px;
      }
      
      .login-container {
        padding: 30px 24px;
        max-width: 100%;
      }
      
      .login-header h1 {
        font-size: 24px;
      }
      
      .login-header p {
        font-size: 13px;
      }
      
      .form-input {
        font-size: 16px; /* 防止 iOS 自动缩放 */
      }
    }
    
    @media (max-width: 480px) {
      body {
        padding: 12px;
      }
      
      .login-container {
        padding: 24px 20px;
      }
      
      .login-header h1 {
        font-size: 22px;
      }
      
      .form-label {
        font-size: 13px;
      }
      
      .form-input {
        padding: 14px 16px;
        font-size: 16px;
      }
      
      .btn-primary {
        padding: 16px;
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <h1>Polymarket 监控面板</h1>
      <p>请输入密码和2FA验证码登录</p>
    </div>

    <div class="error-message" id="errorMessage"></div>
    <div class="success-message" id="successMessage"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="password">密码</label>
        <input
          type="password"
          id="password"
          name="password"
          class="form-input"
          placeholder="请输入密码"
          required
          autocomplete="current-password"
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="code">2FA 验证码</label>
        <input
          type="text"
          id="code"
          name="code"
          class="form-input"
          placeholder="请输入6位验证码"
          maxlength="6"
          pattern="[0-9]{6}"
          autocomplete="one-time-code"
        />
        <div class="info-text">如果已配置2FA，请输入6位验证码</div>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn">
        登录
      </button>
    </form>
  </div>

  <script>
    const API_BASE = '/api';

    function showError(message) {
      const errorEl = document.getElementById('errorMessage');
      errorEl.textContent = message;
      errorEl.classList.add('show');
      document.getElementById('successMessage').classList.remove('show');
    }

    function showSuccess(message) {
      const successEl = document.getElementById('successMessage');
      successEl.textContent = message;
      successEl.classList.add('show');
      document.getElementById('errorMessage').classList.remove('show');
    }

    function hideMessages() {
      document.getElementById('errorMessage').classList.remove('show');
      document.getElementById('successMessage').classList.remove('show');
    }

    async function handleLogin(event) {
      event.preventDefault();
      hideMessages();

      const password = document.getElementById('password').value;
      const code = document.getElementById('code').value;
      const submitBtn = document.getElementById('submitBtn');

      // 禁用按钮
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="loading"></span>登录中...';

      try {
        const resp = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          credentials: 'include', // 重要：包含cookies
          body: JSON.stringify({
            password: password,
            code: code || undefined,
          }),
        });

        const data = await resp.json();

        if (!resp.ok) {
          throw new Error(data.error || '登录失败');
        }

        // 登录成功
        showSuccess('登录成功，正在跳转...');
        
        // 延迟跳转，让用户看到成功消息
        setTimeout(() => {
          window.location.href = '/';
        }, 500);

      } catch (error) {
        console.error('Login error:', error);
        showError(error.message || '登录失败，请检查密码和2FA验证码');
        submitBtn.disabled = false;
        submitBtn.textContent = '登录';
      }
    }

    // 检查是否已经登录
    async function checkAuth() {
      try {
        const resp = await fetch(`${API_BASE}/auth/check`, {
          credentials: 'include',
        });
        const data = await resp.json();
        if (data.authenticated) {
          window.location.href = '/';
        }
      } catch (error) {
        // 忽略错误，继续显示登录页
        console.log('Auth check failed:', error);
      }
    }

    // 页面加载时检查登录状态
    checkAuth();

    // 自动聚焦密码输入框
    document.getElementById('password').focus();
  </script>
</body>
</html>
