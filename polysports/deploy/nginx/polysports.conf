# sports.example.com 必须替换为已签发证书的实际域名。
server {
    listen 80;
    listen [::]:80;
    server_name sports.example.com;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
    location / { return 301 https://sports.example.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sports.example.com;
    ssl_certificate /etc/letsencrypt/live/sports.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sports.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/polysports-src/polysports/frontend/dist;
    index index.html;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_next_upstream off;
        proxy_buffering off;
        proxy_read_timeout 180s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
