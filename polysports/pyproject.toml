[project]
name = "polysports"
version = "0.1.0"
description = "PolySports 独立赛事系统"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "argon2-cffi>=25.1.0",
    "httpx>=0.28,<1",
    "polymarket-client==0.18.0",
    "web3>=7,<8",
    "openpyxl>=3.1,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
